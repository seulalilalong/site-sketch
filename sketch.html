<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>간략 홈페이지</title>
<style>
/* 꾸밈 없는 뼈대 — 흰 바탕 · 칸 이름표 · 블로그에서 가져온 글 · 사진 자리는 회색 상자. 글꼴 · 색 · 무드는 입히지 않는다 */
:root{--ink:#161616;--mute:#6b6b6b;--line:#cfcfcf;--box:#e4e4e4;--tag:#f3f3f3}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow-x:hidden}
a{color:inherit}
.note{background:var(--tag);border-bottom:1px solid var(--line);padding:12px 16px;font-size:13.5px;color:var(--mute)}
.note b{color:var(--ink)}
.page{max-width:1080px;margin:0 auto;padding:0 16px 80px}
.tag{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:3px 10px;margin:0 0 10px;background:#fff}
.tag b{color:var(--ink);font-size:13px}
.tag .min{border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:0 8px;font-size:11.5px}
.tag .star{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:0 8px;font-size:11.5px}
.menu{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}
.menu .tag{margin:0}
.menu a{text-decoration:none;font-size:14.5px}
.menu a:hover{text-decoration:underline}
section.kan{border-bottom:1px solid var(--line);padding:34px 0 30px;scroll-margin-top:12px}
.job{margin:-4px 0 14px;font-size:13px;color:var(--mute)}
.txt p{margin:0 0 10px;max-width:760px}
.txt p.big{font-size:26px;line-height:1.4;font-weight:600;margin-bottom:14px}
.src{font-size:11.5px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px;white-space:nowrap;vertical-align:2px}
.src:hover{color:var(--ink);border-color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0 0}
.ph{background:var(--box);border-radius:6px;aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:12px;font-size:12.5px;color:#444}
.ph b{font-size:12px;color:var(--mute);font-weight:600}
.ph a{text-decoration:none}
.ph.first{grid-column:1/-1;aspect-ratio:16/7}
.empty{margin:14px 0 0;border:1px dashed var(--line);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--mute)}
.empty b{color:var(--ink)}
.empty ul{margin:4px 0 0;padding-left:18px}
footer.kan{padding:30px 0 10px;border-bottom:0}
.later{margin:40px 0 0}
.later h2{font-size:15px;margin:0 0 10px}
.later ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.later li{border:1px dashed var(--line);border-radius:6px;padding:10px 14px;font-size:14px}
.later li span{color:var(--mute);font-size:13px;margin-left:6px}
.err{border:2px solid #b00;padding:16px;margin:40px 16px;border-radius:8px}
/* 고른 짜임 꼴로 늘어놓기(걸음 ④ — kind "plan") */
.tag .lay{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11.5px;color:var(--mute)}
.ar.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.ar.split .photos{margin:0;grid-template-columns:1fr}
.ar.center,.ar.band{text-align:center}.ar.center .txt p,.ar.band .txt p{margin-left:auto;margin-right:auto}
.ar.band{background:var(--tag);border-radius:8px;padding:26px 16px}
.ar.quote .txt p{font-size:21px;line-height:1.5;text-align:center;margin:0 auto 12px}.ar.quote .txt p::before{content:"“";color:var(--mute);margin-right:4px}
.ar.cover .cv{background:var(--box);border-radius:8px;min-height:240px;display:flex;flex-direction:column;justify-content:center;padding:28px}
.ar.cover .cv .txt{background:rgba(255,255,255,.88);border-radius:6px;padding:14px 16px;max-width:620px}
.ar.cover .cv b{font-size:12px;color:var(--mute);margin-bottom:8px}
.ar.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ar.cards .cd{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ar.cards .cd .ph{aspect-ratio:4/3}.ar.cards .cd .txt p{margin:0}
.ar.grid .photos{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ar.list .txt p{border-bottom:1px solid var(--line);padding:8px 0;margin:0;max-width:none}
.ar.zig .zr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;margin-bottom:14px}
.ar.zig .zr:nth-child(even) .ph{order:2}
.ar.form .fm{border:1.5px dashed var(--line);border-radius:8px;padding:14px;margin-top:12px;color:var(--mute);font-size:13px;max-width:520px}
.ar.form .fm i{display:block;height:28px;border:1px solid var(--line);border-radius:4px;margin:8px 0;font-style:normal}
@media (max-width:560px){.ar.split,.ar.zig .zr{grid-template-columns:1fr}.ar.zig .zr:nth-child(even) .ph{order:0}.txt p.big{font-size:22px}.photos{grid-template-columns:1fr 1fr;gap:8px}.ph{font-size:11.5px;padding:8px}.ph.first{aspect-ratio:4/3}}

</script>

<script>
(function(){
var K=window.SKETCH,app=document.getElementById('app');
if(!K||!K.sections){app.innerHTML='<div class="err"><b>뼈대 데이터가 비었어요.</b></div>';return}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function srcUrl(f,u){if(u)return u;f=String(f||'');if(/^\d{6,}$/.test(f))return(K.blog||'')+f;return''}
function srcName(f){f=String(f||'');if(/^\d{6,}$/.test(f))return'글 '+f;if(/^insta/.test(f))return'인스타';if(f==='brief')return'브리프';if(/^link/.test(f))return'링크';return f}
function src(f,u){var h=srcUrl(f,u);return h?'<a class="src" href="'+esc(h)+'" target="_blank" rel="noopener" title="이 문장이 있는 곳">'+esc(srcName(f))+'</a>':(f?'<span class="src">'+esc(srcName(f))+'</span>':'')}
function texts(l){return(l||[]).length?'<div class="txt">'+l.map(function(x){return'<p'+(x.big?' class="big"':'')+'>'+esc(x.t)+src(x.from,x.url)+'</p>'}).join('')+'</div>':''}
function photos(l,first){return(l||[]).length?'<div class="photos">'+l.map(function(p,i){var h=srcUrl(p.from,p.url);var where=(srcName(p.from)||'')+(p.n?'의 사진 '+p.n:'');
  return'<div class="ph'+(first&&i===0?' first':'')+'"><b>사진 자리</b><span>'+(h?'<a href="'+esc(h)+'" target="_blank" rel="noopener">'+esc(where)+'</a>':esc(where))+(p.what?' — '+esc(p.what):'')+'</span></div>'}).join('')+'</div>':''}
function empty(l){return(l||[]).length?'<div class="empty"><b>블로그에서 못 찾은 것</b> — 채워 넣을 자리예요<ul>'+l.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':''}
var toc=K.kind==='toc'||K.kind==='plan',plan=K.kind==='plan',LA=window.LAY_ARR||{};
function ph1(p){var h=srcUrl(p.from,p.url),where=(srcName(p.from)||'')+(p.n?'의 사진 '+p.n:'');return'<div class="ph"><b>사진 자리</b><span>'+(h?'<a href="'+esc(h)+'" target="_blank" rel="noopener">'+esc(where)+'</a>':esc(where))+(p.what?' — '+esc(p.what):'')+'</span></div>'}
function one(x){return'<div class="txt"><p'+(x.big?' class="big"':'')+'>'+esc(x.t)+src(x.from,x.url)+'</p></div>'}
function arrange(s,i){var a=s.layout&&LA[s.layout]?LA[s.layout][1]:'',T=s.texts||[],P=s.photos||[];
  if(!a)return texts(T)+photos(P,i===0);
  if(a==='split-l'||a==='split-r'){var pc='<div>'+photos(P)+'</div>',tc='<div>'+texts(T)+'</div>';return'<div class="ar split">'+(a==='split-l'?pc+tc:tc+pc)+'</div>'}
  if(a==='cover')return'<div class="ar cover"><div class="cv"><b>사진 자리 '+(P[0]?'— '+esc(srcName(P[0].from))+(P[0].n?'의 사진 '+P[0].n:'')+(P[0].what?' · '+esc(P[0].what):''):'')+'</b>'+texts(T)+'</div></div>'+photos(P.slice(1));
  if(a==='cards'){var n=Math.max(T.length,P.length),c='';for(var k=0;k<n;k++)c+='<div class="cd">'+(P[k]?ph1(P[k]):'')+(T[k]?one(T[k]):'')+'</div>';return'<div class="ar cards">'+c+'</div>'}
  if(a==='zigzag'){var m=Math.max(T.length,P.length),z='';for(var j=0;j<m;j++)z+='<div class="zr">'+(P[j]?ph1(P[j]):'<div></div>')+(T[j]?one(T[j]):'<div></div>')+'</div>';return'<div class="ar zig">'+z+'</div>'}
  if(a==='form')return'<div class="ar form">'+texts(T)+'<div class="fm">신청서 자리(칸 이름은 다음 차례에) <i></i><i></i><i></i></div>'+photos(P)+'</div>';
  if(a==='quote')return'<div class="ar quote">'+texts(T)+'</div>'+photos(P);
  return'<div class="ar '+a+'">'+texts(T)+photos(P)+'</div>'}
function layTag(id){return id&&LA[id]?'<span class="lay">짜임 · '+esc(LA[id][0])+'</span>':''}
var h='<div class="note"><b>'+(plan?'고른 짜임으로 다시 지은 뼈대':toc?'목차대로 다시 지은 뼈대':'꾸밈 없는 뼈대')+'</b> · '+esc(K.name)+(K.made?' · '+esc(K.made):'')+'<br>'+
  '글은 모두 블로그 · 링크에서 <b>그대로</b> 가져왔어요. 문장 끝의 작은 「글 번호」를 누르면 그 글이 열려요. 점선 이름표와 「하는 일」 한 줄은 칸을 알아보라고 붙인 이름표예요.<br>'+
  '회색 상자는 사진 자리예요(사진은 아직 넣지 않았어요). 글꼴 · 색 · 무드는 다음 차례에 입혀요.'+(K.read?'<br>읽은 것: '+esc(K.read):'')+'</div><div class="page">';
h+='<nav class="menu"><span class="tag"><b>메뉴</b> 기본'+layTag(K.menuLayout)+'</span>'+K.sections.map(function(s,i){return'<a href="#k'+(i+1)+'">'+esc(s.label)+'</a>'}).join('')+'</nav>';
K.sections.forEach(function(s,i){
  h+='<section class="kan" id="k'+(i+1)+'"><span class="tag"><b>칸 '+(i+1)+' · '+esc(s.label)+'</b>'+(s.star?'<span class="star">강조 칸</span>':'')+(toc&&s.min?'<span class="min">최소 완성본</span>':'')+layTag(s.layout)+'</span>'+
    (s.job?'<p class="job">하는 일 · '+esc(s.job)+'</p>':'')+arrange(s,i)+empty(s.empty)+'</section>'});
var f=K.footer||{};
h+='<footer class="kan"><span class="tag"><b>바닥</b> 기본'+layTag(f.layout)+'</span>'+texts(f.texts)+empty(f.empty)+'</footer>';
if((K.later||[]).length)h+='<div class="later"><h2>나중에 넣을 칸</h2><ul>'+K.later.map(function(x){return'<li><b>'+esc(x.label)+'</b>'+(x.job?'<span>'+esc(x.job)+'</span>':'')+'</li>'}).join('')+'</ul></div>';
h+='</div>';
app.innerHTML=h;window.__ok=1;
})();
</script></body></html>
