<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 청사진</title>
<style>
/* 내 청사진 — 칸마다 이름표 · 고른 짜임(회색 와이어프레임) · 하는 일 한 줄. 꾸밈 없음(글꼴 · 색은 다음 차례). site-sketch 걸음 ④ */
:root{--ink:#161616;--mute:#6b6b6b;--line:#cfcfcf}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow-x:hidden}
.sheet{max-width:1180px;margin:0 auto;padding:32px 16px 60px}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.top h1{margin:0;font-size:28px;letter-spacing:-.01em}.top p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mute)}.legend i{display:inline-block;width:14px;height:12px;vertical-align:-1px;margin-right:4px;border-radius:2px}
.rows{margin-top:22px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:200px minmax(0,420px) 1fr;align-items:center;column-gap:0}
.tag{justify-self:end;margin-right:16px;display:flex;align-items:center;gap:8px;text-align:right}
.tag b{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px}
.tag span{font-size:15px;font-weight:700;line-height:1.3}
.row.base .tag b{background:#fff;color:var(--mute);border:1px dashed var(--mute)}
.does{position:relative;padding:4px 0 4px 60px;font-size:14.5px;line-height:1.5}
.does::before{content:"";position:absolute;left:10px;top:50%;width:40px;border-top:1.5px solid #999}
.does::after{content:"";position:absolute;left:6px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:#999}
.does small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.flag{display:inline-block;font-size:11px;border:1px solid var(--ink);border-radius:999px;padding:0 7px;margin-right:4px;font-weight:600}
.flag.st{background:var(--ink);color:#fff}
.later{margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
.later h2{font-size:15px;margin:0 0 8px}.later li{font-size:14px;margin:2px 0}.later span{color:var(--mute);font-size:13px;margin-left:6px}
.nopick{border:1.5px dashed var(--line);border-radius:6px;padding:14px;color:var(--mute);font-size:13px;text-align:center}
.err{border:2px solid #b00;padding:16px;margin:40px 16px;border-radius:8px}
@media (max-width:700px){.row{grid-template-columns:1fr;row-gap:6px}.tag{justify-self:start;margin:0;text-align:left}.does{padding-left:22px}.does::before{display:none}.does::after{left:6px;top:13px}}

/* 짜임 그림 — 회색만(꾸밈 없음) */
.w{position:relative;background:#fff;border:1.5px solid #d0d0d0;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;color:#8a8a8a;font:12px/1 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:left}
.w i{display:block;font-style:normal}
.w .ph{background:#e3e3e3;border-radius:3px;position:relative;flex:none}
.w .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .6px),#cdcdcd 50%,transparent calc(50% + .6px)),linear-gradient(to top left,transparent calc(50% - .6px),#cdcdcd 50%,transparent calc(50% + .6px))}
.w .ph.mp{background:#ececec;background-image:linear-gradient(#dcdcdc 1px,transparent 1px),linear-gradient(90deg,#dcdcdc 1px,transparent 1px);background-size:14px 14px}
.w .ph.mp::after{content:"";inset:auto;left:50%;top:40%;width:10px;height:10px;border-radius:50% 50% 50% 0;background:#8a8a8a;transform:translate(-50%,-50%) rotate(-45deg)}
.w .t{height:6px;border-radius:3px;background:#d6d6d6;flex:none;max-width:100%}
.w .t.h{height:10px;background:#b3b3b3}
.w .t.xs{height:5px;background:#e2e2e2}
.w .t.wh{background:#fff}
.w .b{height:12px;border-radius:6px;background:#8c8c8c;flex:none}
.w .b.o{background:transparent;border:1.5px solid #8c8c8c}
.w .r{display:flex;min-width:0}
.w .c{display:flex;flex-direction:column;min-width:0}
.w .bx{border:1px solid #d6d6d6;border-radius:4px;background:#fafafa;min-width:0}
.w .bd{display:flex;flex-direction:column;background:#efefef;border-radius:4px}
.w .dt{border-radius:50%;background:#cfcfcf;flex:none}
.w .in{border:1px solid #cfcfcf;border-radius:3px;background:#fff;flex:none}
.w .g{display:grid}
.w .ov{position:relative}
.w .on{position:absolute;left:0;right:0;top:30px}
.w .big{height:26px;border-radius:4px;background:#9d9d9d;width:100%}
.w .ar{width:16px;height:16px;border:1px solid #bbb;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#888;line-height:1}
.w .qt{font:700 30px/.6 Georgia,serif;color:#bbb;height:16px}
.w .num{width:18px;height:18px;border-radius:50%;background:#9a9a9a;color:#fff;display:grid;place-items:center;font-size:11px}
.w .pl{font-size:14px;color:#999;line-height:1}
.w .hb{display:flex;flex-direction:column;gap:3px;width:18px}.w .hb i{height:2px;background:#999}
.w .cal{height:12px;border:1px solid #ddd;border-radius:2px;background:#fff}.w .cal.on{background:#d6d6d6}
